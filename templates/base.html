<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DailyDrop{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-light border-bottom mb-3">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="{{ url_for('quiz.today') }}">
        💡 DEV5 <small class="text-muted">개발자 5고개</small>
      </a>
      <div class="navbar-nav">
        <a class="nav-link" href="{{ url_for('quiz.today') }}">오늘의 퀴즈</a>
        <a class="nav-link" href="{{ url_for('ranking.ranking') }}">랭킹</a>
        <a class="nav-link" href="{{ url_for('ranking.history') }}">내 기록</a>
        <a class="nav-link" href="{{ url_for('quiz.archive') }}">지난 문제</a>
      </div>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="{{ url_for('auth.logout') }}">로그아웃</a>
      </div>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
