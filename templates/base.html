<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DailyDrop{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    :root {
      --brand: #5b5bd6;
    }

    body {
      background: #f7f8fb;
    }

    .topbar {
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 1030;
    }

    .brand {
      color: var(--brand);
      font-weight: 700;
    }

    .app-sidebar {
      width: 230px;
      flex: 0 0 230px;
      height: calc(100vh - 64px);
      align-self: flex-start;
      position: sticky;
      top: 64px;
      overflow-y: auto;
    }

    .side-link {
      display: block;
      padding: .8rem 1rem;
      margin-bottom: .6rem;
      border: 1px solid #e5e7eb;
      border-radius: .6rem;
      text-align: center;
      color: #444;
      text-decoration: none;
      background: #fff;
    }

    .side-link:hover {
      background: #f1f2f9;
    }

    .side-link.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
      font-weight: 600;
    }

    main.flex-grow-1 {
      min-width: 0;
    }
  </style>
</head>

<body>
  <!-- 상단바 -->
  <nav class="topbar d-flex align-items-center justify-content-between bg-white border-bottom px-4">
    <a class="brand fs-5 text-decoration-none" href="{{ url_for('quiz.today') }}">DailyDrop</a>
    {% if current_user %}
    <div class="dropdown">
      <a class="btn btn-outline-secondary btn-sm dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
        {{ current_user.nickname }} 님
      </a>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="{{ url_for('ranking.history') }}">내 기록</a></li>
        <li><a class="dropdown-item" href="{{ url_for('auth.logout') }}">로그아웃</a></li>
      </ul>
    </div>
    {% endif %}
  </nav>

  <div class="d-flex">
    {% if current_user %}
    {% set ep = request.endpoint %}
    <aside class="app-sidebar bg-white border-end p-3 d-flex flex-column">
      <a class="side-link {{ 'active' if ep == 'quiz.today' else '' }}" href="{{ url_for('quiz.today') }}">오늘의 퀴즈</a>
      <a class="side-link {{ 'active' if ep == 'ranking.ranking' else '' }}"
        href="{{ url_for('ranking.ranking') }}">랭킹</a>
      <a class="side-link {{ 'active' if ep == 'ranking.history' else '' }}" href="{{ url_for('ranking.history') }}">내
        기록</a>
      <a class="side-link {{ 'active' if ep == 'quiz.archive' else '' }}" href="{{ url_for('quiz.archive') }}">지난 문제</a>
      <a class="side-link mt-auto" href="{{ url_for('auth.logout') }}">로그아웃</a>
    </aside>
    {% endif %}

    <main class="flex-grow-1 p-4">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
