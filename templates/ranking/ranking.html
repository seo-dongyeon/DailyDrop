{% extends "base.html" %}
{% block title %}랭킹 · DailyDrop{% endblock %}
{% block content %}
<h2>오늘의 랭킹 <small class="text-muted">{{ date }}</small></h2>
<table class="table">
  <thead><tr><th>순위</th><th>닉네임</th><th>점수</th><th>힌트 사용횟수</th><th>풀이 완료 시각</th></tr></thead>
  <tbody>
    {% for r in rows %}
      <tr class="{{'table-primary' if r.is_me else '' }}">
        <td>{{ r.rank }}</td>
        <td>{{ r.nickname }}</td>
        <td>{{ r.score }}</td>
        <td>{{ r.hints_used }}</td>
        <td>{{ r.solved_at.strftime('%H:%M:%S') }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
