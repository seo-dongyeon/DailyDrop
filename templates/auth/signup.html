{% extends "base.html" %}
{% block title %}회원가입 · DailyDrop{% endblock %}
{% block content %}
<style>
  body {
    background: var(--brand);
  }
</style>
<div class="d-flex flex-column align-items-center mt-5">
  <a href="{{ url_for('quiz.today') }}" class="text-decoration-none mb-4">
    <span class="fw-bold" style="font-size:2.8rem; color:#fff; letter-spacing:-1px;">DailyDrop</span>
  </a>

  <div class="card shadow-sm p-5" style="width: 440px;">
    <!-- <h4 class="text-center mb-3 fw-bold">회원가입</h4> -->
    {% if error %}<p class="text-danger">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.signup') }}">
      <div class="mb-3">
        <input name="username" class="form-control form-control-lg" placeholder="아이디">
      </div>
      <div class="mb-3">
        <input name="password" class="form-control form-control-lg" type="password" placeholder="비밀번호">
      </div>
      <div class="mb-3">
        <input name="nickname" class="form-control form-control-lg" placeholder="닉네임 (랭킹 표시명)">
      </div>
      <button type="submit" class="btn btn-lg w-100"
        style="background-color:var(--brand); border-color:var(--brand); color:#fff;">가입하기</button>
    </form>
  </div>
</div>
{% endblock %}
