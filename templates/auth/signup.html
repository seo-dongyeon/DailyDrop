{% extends "base.html" %}
{% block title %}회원가입 · DailyDrop{% endblock %}
{% block content %}
<h2>회원가입</h2>
{% if error %}<p class="text-danger">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('auth.signup') }}">
  <input name="username" placeholder="아이디"><br>
  <input name="password" type="password" placeholder="비밀번호"><br>
  <input name="nickname" placeholder="닉네임 (랭킹 표시명)"><br>
  <button type="submit">가입하기</button>
</form>
{% endblock %}
