{% extends "base.html" %}
{% block title %}로그인 · DailyDrop{% endblock %}
{% block content %}
<style>
  body {
    background: var(--brand);
  }
</style>
<div class="d-flex flex-column align-items-center mt-5">
  <a href="{{ url_for('quiz.today') }}" class="text-decoration-none mb-4">
    <span class="fw-bold" style="font-size:2.8rem; color:#fff; letter-spacing:-1px;">DailyDrop</span>
  </a>

  <div class="card shadow-sm p-5" style="width: 440px;">
    <!-- <h4 class="text-center mb-3 fw-bold">로그인</h4> -->
    {% if error %}<p class="text-danger">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.login') }}">
      <div class="mb-3">
        <input name="username" class="form-control form-control-lg" placeholder="아이디">
      </div>
      <div class="mb-3">
        <input name="password" type="password" class="form-control form-control-lg" placeholder="비밀번호">
      </div>
      <div class="mb-3">
        <button type="submit" class="btn btn-lg w-100"
          style="background-color:var(--brand); border-color:var(--brand); color:#fff;">로그인</button>
      </div>
    </form>
    <p class="text-center"><a href="{{ url_for('auth.signup') }}" class="text-muted text-decoration-none">회원가입</a>
    </p>
  </div>
</div>
{% endblock %}
