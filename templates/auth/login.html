{% extends "base.html" %}
{% block title %}로그인 · DailyDrop{% endblock %}
{% block content %}
<div class="d-flex justify-content-center mt-5">
  <div class="card shadow-sm p-5" style="width: 360px;">
    <h4 class="text-center mb-3 fw-bold">로그인</h4>
    {% if error %}<p class="text-danger">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.login') }}">
      <div class="mb-3">
        <input name="username" class="form-control" placeholder="아이디">
      </div>
      <div class="mb-3">
        <input name="password" type="password" class="form-control" placeholder="비밀번호">
      </div>
      <div class="mb-3">
        <button type="submit" class="btn btn-primary w-100">로그인</button>
      </div>
    </form>
    <p class="text-center"><a href="{{ url_for('auth.signup') }}" class="text-muted text-decoration-none">회원가입으로 →</a>
    </p>
  </div>
</div>
{% endblock %}
