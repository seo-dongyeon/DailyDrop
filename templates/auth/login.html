{% extends "base.html" %}
{% block title %}로그인 · DailyDrop{% endblock %}
{% block content %}
<h2>로그인</h2>
{% if error %}<p class="text-danger">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('auth.login') }}">
  <input name="username" placeholder="아이디"><br>
  <input name="password" type="password" placeholder="비밀번호"><br>
  <button type="submit">로그인</button>
</form>
<p><a href="{{ url_for('auth.signup') }}">회원가입</a></p>
{% endblock %}
